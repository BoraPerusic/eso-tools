services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eso-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Password123! -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: eso-api-server
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=EsoToolsDB;encrypt=false
      - DB_USER=sa
      - DB_PASSWORD=Password123!
    depends_on:
      sqlserver:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: eso-mcp-server
    ports:
      - "8081:8080" # Map 8080 internal (SSE) to 8081 host to avoid conflict with api-server
    environment:
      - API_SERVER_HOST=api-server
      - API_SERVER_PORT=50051
      # Assuming we need to tell it to run in SSE mode if it's not default.
      # If the Kotlin SDK defaults to Stdio, we might need an arg.
      # For now, relying on User's statement that it "will be another service" implying it handles it.
    depends_on:
      api-server:
        condition: service_started
    stdin_open: true
    tty: true
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: eso-agent
    ports:
      - "8000:8000"
    environment:
      - MCP_SERVER_SSE_URL=http://mcp-server:8080/sse
      # Add Azure keys here or use .env file
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
    depends_on:
      - mcp-server
