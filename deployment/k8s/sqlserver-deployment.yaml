apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eso-sqlserver
  labels:
    app: eso-sqlserver
spec:
  serviceName: "eso-sqlserver"
  replicas: 1
  selector:
    matchLabels:
      app: eso-sqlserver
  template:
    metadata:
      labels:
        app: eso-sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          value: "Password123!"
        - name: MSSQL_PID
          value: "Express"
        # volumeMounts: ... (skipping persistence for simple task scope unless requested)
---
apiVersion: v1
kind: Service
metadata:
  name: eso-sqlserver
spec:
  selector:
    app: eso-sqlserver
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
